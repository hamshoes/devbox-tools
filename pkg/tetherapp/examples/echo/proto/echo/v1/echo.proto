syntax = "proto3";
package echo.v1;
option go_package = "github.com/hamshoes/devbox-tools/pkg/tetherapp/examples/echo/gen/echo/v1;echov1";

message EchoRequest  { string text = 1; }
message EchoResponse { string text = 1; }

service EchoVM   { rpc Echo(EchoRequest) returns (EchoResponse); } // mac → vm
service EchoMac  { rpc Echo(EchoRequest) returns (EchoResponse); } // vm → mac
service Unlisted { rpc Echo(EchoRequest) returns (EchoResponse); } // in the schema, not in the manifest
