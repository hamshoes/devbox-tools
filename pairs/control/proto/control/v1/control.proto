// control.v1: the devbox control plane (what's needed now).
//
// ─────────────────────────────────────────────────────────────────────────────
// DEFINITION (INFRA == CONTROL)
//   Control owns everything it runs that ISN'T a tether binary and doesn't
//   talk to one: operations on the "physical" layer, i.e. the VM, docker,
//   ssh forwards, and starting and running pairs.
//   Anything that only talks to a separate running app is a PAIR, not control
//   (clip, notify, open, approve, xcb, snap, feedback...).
//
//   It runs as the tether pair `control`: the VM gateway is on
//   DEVBOX_CONTROL_PORT (published on VM loopback), the Mac gateway is
//   dialled through an ssh unix-socket forward, and the token is
//   DISPATCH_TOKEN.
//   Mac side = `dev`. VM side = controld.
//
// RULES
//   1. The Mac is in charge. Mac → VM calls declare desired state;
//      VM → Mac calls are requests that `dev` carries out.
//   2. One user, full access. Being authenticated from Sam's machines is the
//      security boundary. No roles, no policy engine.
//   3. Who's asking travels with requests. tether-gw stamps the caller's
//      SO_PEERCRED (uid, pid) on every call. For control, controld
//      also puts the ORIGINAL requester (e.g. the `bb forward` process)
//      into the request, so forwards are labelled and attributed per instance.
//   4. Pairs and forwards are session-scoped: released when the session ends
//      or after 30s without the control connection. Services are not: they
//      keep running after the session ends.
//   5. control.v1 changes in place; there is one user and no compatibility
//      to keep.
//
// VERSIONS
//   A schema change changes the hash, and the gateway refuses a mismatch.
//   `dev` and the image carry the same devbox.lock, so both sides run the
//   control version it names.
//
// ERRORS (Connect codes)
//   invalid_argument     bad shape or values (port < 1024, reserved port, bad host)
//   failed_precondition  the Mac port is in use by something else, or a static
//                        forward can't be removed from the VM
//   resource_exhausted   more than DEVBOX_MAX_FORWARDS dynamic forwards this session
//   unavailable          the peer is down (fails fast)
//
// RESERVED PORTS (never exposed or auto-forwarded)
//   DEVBOX_RESERVED_PORTS, and any static forward from config
// ─────────────────────────────────────────────────────────────────────────────

syntax = "proto3";
package control.v1;

option go_package = "github.com/hamshoes/devbox-tools/pairs/control/gen/control/v1;controlv1";

// ═════════════════════════════════════════════════════════════════════════════
// Mac → VM
// ═════════════════════════════════════════════════════════════════════════════

service Control {
  // The FULL desired set of pairs for this session: pairs
  // missing from it are stopped. Sending the same spec again (same name,
  // version and token) leaves a running pair untouched, so after a
  // reconnect `dev` just sends the set again. That's the only resync needed.
  // Never applies to `control` itself.
  rpc ApplyPairs(ApplyPairsRequest) returns (ApplyPairsResponse);

  // Liveness check, no side effects. `version` is the build's
  // release version.
  rpc Health(HealthRequest) returns (HealthResponse);

  // The FULL set of services named in `dev`'s config. controld replaces its
  // config layer with it; manifest and `bb svc` services stay unless a
  // config entry names them. Services outlive the session (unlike pairs).
  rpc ApplyServices(ApplyServicesRequest) returns (ApplyServicesResponse);
}

message PairSpec {
  string name    = 1;  // ^[a-z0-9-]{1,32}$, never "control"
  string version = 2;  // "latest" or "vX.Y.Z"
  uint32 vm_port = 3;  // DEVBOX_PAIR_PORT_MIN..MAX, unique within the request
  string token   = 4;  // 32..128 hex, fresh every session
}
message PairResult {
  string name    = 1;
  string state   = 2;  // "started" | "failed" | "not_installed" | "mismatch"
                       // not_installed: the VM has no such pair; controld never
                       // syncs to find one
  string error   = 3;
  string host    = 4;  // container IP the Mac forward targets
  uint32 vm_port = 5;
  string version = 6;  // the version actually running
}
message ApplyPairsRequest  { repeated PairSpec pairs = 1; }
message ApplyPairsResponse { repeated PairResult results = 1; }

message ServiceSpec {
  string name             = 1;  // ^[a-z0-9-]{1,32}$
  string tool             = 2;  // a tool from manifest.json
  repeated string args    = 3;
  map<string, string> env = 4;
  bool enabled            = 5;
}
message ServiceStatus {
  string name             = 1;
  string tool             = 2;
  repeated string args    = 3;
  map<string, string> env = 4;
  bool enabled            = 5;
  string source           = 6;  // "config" | "manifest" | "bb"
  string state            = 7;  // "running" | "disabled" | "not_installed" | "failed"
  string error            = 8;
  string since            = 9;  // RFC 3339: when state last changed
}
message ApplyServicesRequest  { repeated ServiceSpec services = 1; }
message ApplyServicesResponse { repeated ServiceStatus services = 1; }  // one per request entry

message HealthRequest  {}
message HealthResponse {
  string side    = 1;  // "vm" | "mac"
  string version = 2;
  string at      = 3;  // RFC 3339
}

// ═════════════════════════════════════════════════════════════════════════════
// VM → Mac
// ═════════════════════════════════════════════════════════════════════════════

service ControlEvents {
  // A pair changed state outside ApplyPairs (crashed, gave up).
  rpc PairStatus(PairStatusRequest) returns (PairStatusResponse);

  // Liveness check, no side effects.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Listening TCP sockets in the container changed.
  // controld polls every 2s and debounces changes over 1s.
  // With `snapshot = true`, `opened` is the complete current list and `dev`
  // replaces what it knew. controld sends a snapshot on every
  // (re)connect, so no List call is needed.
  // What `dev` does is set by [control.ports] auto = "ask" | "on" | "off":
  //   ask → notification "vite on :5173, forward?"; clicking it exposes
  //   on  → forward straight away (source "auto"), then notify
  //   off → ignore
  // Auto forwards are removed when their port closes. Expose'd and config
  // forwards stay. Reserved ports are never auto-forwarded. Loopback-only
  // listeners can't be reached through the container IP: `dev` shows a
  // one-time hint ("bind 0.0.0.0") instead.
  rpc PortsChanged(PortsChangedRequest) returns (PortsChangedResponse);
}

message PairStatusRequest  { PairResult status = 1; }
message PairStatusResponse {}

message PortsChangedRequest {
  bool snapshot            = 1;
  repeated Listener opened = 2;
  repeated uint32 closed   = 3;  // ignored when snapshot = true
  string host              = 4;  // container IP: the target for auto forwards
}
message PortsChangedResponse {}

message Listener {
  uint32 port          = 1;
  string address       = 2;  // "0.0.0.0", "::", "127.0.0.1", ...
  bool   loopback_only = 3;
  int32  pid           = 4;
  string process       = 5;  // comm, e.g. "node"
  string cmd           = 6;  // argv, truncated to 256 chars
}

service Forwards {
  // Backs `bb forward`.
  // `dev` runs `ssh -O forward -L 127.0.0.2:<port>:<target_host>:<port>`
  // (and the localhost equivalent) on its ControlMaster, using the same port
  // on the Mac so devbox:<port> stays the same name.
  // Already forwarded → returns the existing Forward (safe to repeat).
  // The forward lasts until Unexpose or the end of the session; it survives
  // the server restarting.
  rpc Expose(ExposeRequest) returns (Forward);

  // Removes a dynamic forward ("expose" or "auto").
  // A config forward → failed_precondition. An unknown port → OK (no-op).
  rpc Unexpose(UnexposeRequest) returns (UnexposeResponse);

  // Every forward `dev` holds this session: config, expose and
  // auto. Backs `bb ports` and `dev tether status`.
  rpc ListForwards(ListForwardsRequest) returns (ListForwardsResponse);
}

// ═════════════════════════════════════════════════════════════════════════════
// Local: controld's own unix socket (DEVBOX_CONTROLD_SOCKET), for `bb`
// ═════════════════════════════════════════════════════════════════════════════
//
// Never listed in manifest.json, so the gateways never carry it. controld
// fills each request's Requester from the socket's SO_PEERCRED (any value
// the caller sends is replaced) and the target host itself, then calls the
// Forwards service above. With no session (the Mac is not connected) every
// call fails with unavailable.
service Local {
  rpc Expose(ExposeRequest) returns (Forward);
  rpc Unexpose(UnexposeRequest) returns (UnexposeResponse);
  rpc ListForwards(ListForwardsRequest) returns (ListForwardsResponse);

  // `bb svc`. Enable/Disable of a service named in dev config fails with
  // failed_precondition ("set in dev config").
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc EnableService(ServiceRequest) returns (ServiceStatus);
  rpc DisableService(ServiceRequest) returns (ServiceStatus);

  // `bb status`: what controld runs and what went wrong lately. Works with
  // no session.
  rpc Status(StatusRequest) returns (StatusResponse);
}

message ListServicesRequest  {}
message ListServicesResponse { repeated ServiceStatus services = 1; }
message ServiceRequest       { string name = 1; }

message StatusRequest {}
message StatusResponse {
  string version                 = 1;  // controld's release version
  bool   control_running         = 2;  // tether-gw and the control pair are installed
  bool   session                 = 3;  // the Mac is connected
  repeated ServiceStatus services = 4;
  repeated PairResult pairs       = 5;  // pairs started this session, latest state
  repeated Problem problems       = 6;  // most recent last
}
message Problem {
  string at      = 1;  // RFC 3339
  string source  = 2;  // e.g. "service/x", "pair/notify", "sync"
  string message = 3;
}

// The process that originally asked, filled in by controld from the
// SO_PEERCRED of its local socket (not controld itself, which is the
// gateway's caller).
message Requester {
  uint32 uid = 1;
  int32  pid = 2;
  string cmd = 3;  // argv, truncated to 256 chars
}

message ExposeRequest {
  uint32    port        = 1;  // container port; the Mac uses the same port
  string    target_host = 2;  // container IP (controld knows it)
  string    label       = 3;  // optional ("vite", "api"); shown in lists and notifications
  Requester requester   = 4;
}
message UnexposeRequest  { uint32 port = 1; Requester requester = 2; }
message UnexposeResponse {}

message ListForwardsRequest  {}
message ListForwardsResponse { repeated Forward forwards = 1; }

message Forward {
  uint32 vm_port            = 1;
  uint32 mac_port           = 2;  // equals vm_port in v1
  repeated string mac_addrs = 3;  // ["devbox:5173", "localhost:5173"]
  string label              = 4;
  string source             = 5;  // "config" | "expose" | "auto"
  Requester requester       = 6;  // unset for config forwards
  string created_at         = 7;
  string state              = 8;  // "active" | "failed"
  string error              = 9;
}

// ═════════════════════════════════════════════════════════════════════════════
// manifest.json (each side enforces its own copy)
// ═════════════════════════════════════════════════════════════════════════════
//
// {
//   "pair": "control",
//   "mac": { "calls": [
//     "control.v1.Control/ApplyPairs", "control.v1.Control/Health",
//     "control.v1.Control/ApplyServices" ] },
//   "vm":  { "calls": [
//     "control.v1.ControlEvents/PairStatus", "control.v1.ControlEvents/Health",
//     "control.v1.ControlEvents/PortsChanged",
//     "control.v1.Forwards/Expose", "control.v1.Forwards/Unexpose",
//     "control.v1.Forwards/ListForwards" ] },
//   "limits": { "max_message": 1048576 }
// }
