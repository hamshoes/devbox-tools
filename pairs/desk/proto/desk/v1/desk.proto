syntax = "proto3";
package desk.v1;
option go_package = "github.com/hamshoes/devbox-tools/pairs/desk/gen/desk/v1;deskv1";

// VM → Mac
service Desk {
  rpc Ask(AskRequest) returns (AskResponse);
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);
}
// Mac → VM
service DeskReplies {
  rpc Answer(AnswerRequest) returns (AnswerResponse);
}

message Requester {
  uint32 uid      = 1;  // from the ask file's OWNER (stat), not from its contents
  string user     = 2;
  int32  pid      = 3;  // stated by the asker; display only
  string run_id   = 4;  // stated by the asker; display only
  string run_name = 5;  // stated by the asker; display only
}
message AskRequest {
  string ask_id     = 1;  // ^[a-z0-9]{8,40}$
  string kind       = 2;  // "git-push" (v1); "generic" for `agentic ask`
  string title      = 3;  // ≤ 120 chars
  string detail     = 4;  // ≤ 2000 chars
  string cwd        = 5;  // ≤ 256 chars
  Requester requester = 6;
  string created_at = 7;
}
message AskResponse      { string state = 1; }  // "queued" | "showing" | "answered"
message WithdrawRequest  { string ask_id = 1; string reason = 2; }
message WithdrawResponse {}
message AnswerRequest    { string ask_id = 1; string decision = 2; string note = 3; string answered_at = 4; }
// decision: "allow" | "deny"
message AnswerResponse   {}
