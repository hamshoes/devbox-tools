syntax = "proto3";
package ping.v1;
option go_package = "github.com/hamshoes/devbox-tools/pairs/ping/gen/ping/v1;pingv1";

message RequestSeenRequest  { string method = 1; string route = 2; int32 status = 3; string at = 4; }
message RequestSeenResponse {}
message PingRequest  { string note = 1; }
message PingResponse { string pong = 1; string at = 2; }

service PingEvents  { rpc RequestSeen(RequestSeenRequest) returns (RequestSeenResponse); } // vm → mac
service PingControl { rpc Ping(PingRequest) returns (PingResponse); }                     // mac → vm
