name: release
on:
  push:
    branches: [main]
    paths: ['tools/**', '!tools/**/*.md', 'pkg/**', '!pkg/**/*.md', 'pairs/**', '!pairs/**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.plan.outputs.any }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: plan
        run: scripts/plan.sh >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: false
      - name: vet
        working-directory: ${{ matrix.dir }}
        env: { GOWORK: 'off' }
        run: go vet ./...
      - name: generated code is current
        if: matrix.kind == 'pair'
        run: |
          scripts/pair-generate.sh "${{ matrix.name }}"
          git diff --exit-code -- "${{ matrix.dir }}" || { echo "error: generated code is stale; run scripts/pair-generate.sh ${{ matrix.name }} and commit" >&2; exit 1; }
          [ -z "$(git ls-files --others --exclude-standard -- "${{ matrix.dir }}")" ] || { echo "error: generated code is not committed" >&2; exit 1; }
      - name: build
        run: scripts/build.sh "${{ matrix.kind }}" "${{ matrix.name }}" "${{ matrix.version }}"
      - name: release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: scripts/release.sh "${{ matrix.kind }}" "${{ matrix.name }}" "${{ matrix.version }}" "${{ matrix.prev }}"
